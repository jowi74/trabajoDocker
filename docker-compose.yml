services:
  web:
    build: .
    container_name: django_app
    volumes:
      - staticfiles:/usr/src/app/staticfiles
    expose:
      - "8000"
    restart: always

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_proxy
    ports:
      - "8081:80"
    volumes:
      - staticfiles:/usr/src/app/staticfiles:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always

volumes:
  staticfiles:
